<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tech.Com Live Studio</title>
<style>
:root{--bg:#060a18;--sf:#0e1630;--sv:#16213f;--tx:#e6edff;--mu:#9fb0d6;--ol:#22305c;--ac:#22d3ee;--ac2:#3b82f6;--rd:#ef4444;--am:#f59e0b;--gn:#22c55e;--hd1:#0a1b45;--hd2:#0b5c78;--onac:#04202a}
[data-theme=light]{--bg:#f1f5fd;--sf:#fff;--sv:#e6ecfa;--tx:#0b1330;--mu:#4a5a80;--ol:#cfd8ef;--ac:#0e7490;--ac2:#2563eb;--hd1:#1d4ed8;--hd2:#06b6d4;--onac:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.hd{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:max(14px,env(safe-area-inset-top)) 18px 16px}
.hr{display:flex;align-items:center;gap:12px}.hr img{width:52px;height:52px;border-radius:50%;background:#000}
.hr .t{flex:1;min-width:0}.hr h1{font-size:23px;display:flex;gap:6px;align-items:center}.hr small{opacity:.85;font-size:12px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:#ffffff30;color:#fff;font-size:18px;cursor:pointer}
.pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:#ffffffee;color:#0b1330;border-radius:99px;padding:5px 12px;font:700 11px ui-monospace,monospace;border:0}
.pill.g{background:#ffffff30;color:#fff;font:12px system-ui;cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-right:6px}
.dot.live{background:var(--rd)}.dot.wait{background:var(--am)}
.pg{padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--sf);border:1px solid var(--ol);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:11px}
.card h3{font-size:16px}.sub{font-size:12px;color:var(--mu)}.warn{font-size:12px;color:var(--am)}.err{font-size:12px;color:var(--rd)}
.chips{display:flex;gap:8px}.chip{flex:1;text-align:center;padding:11px 4px;border-radius:12px;background:var(--sv);border:1px solid var(--ol);color:var(--tx);cursor:pointer;font:13px system-ui}
.chip.on{background:color-mix(in srgb,var(--ac) 20%,transparent);border-color:var(--ac);font-weight:600}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 16px;font:700 15px system-ui;background:linear-gradient(90deg,var(--ac2),var(--ac));color:var(--onac);cursor:pointer;letter-spacing:.4px;width:100%}
.btn.red{background:var(--rd);color:#fff}.btn[disabled]{opacity:.5;cursor:not-allowed}
.sb{border:1px solid var(--ol);background:transparent;color:var(--tx);border-radius:12px;padding:9px 14px;cursor:pointer;font:13px system-ui}
.sb[disabled]{opacity:.45;cursor:not-allowed}.sb.red{color:var(--rd);border-color:var(--rd)}
.row{display:flex;gap:8px;align-items:center}.row>.f{flex:1;min-width:0}.sp{flex:1}
.k{font:600 14px ui-monospace,monospace}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none}
.sw i{width:48px;height:27px;border-radius:99px;background:var(--sv);border:1px solid var(--ol);position:relative;flex:none}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--mu);transition:.15s}
.sw.on i{background:var(--ac)}.sw.on i:after{left:23px;background:#fff}.sw.dis{opacity:.5;cursor:not-allowed}
.modes{display:flex;justify-content:space-around}.m{text-align:center;font-size:12px;cursor:pointer;background:0;border:0;color:var(--tx)}
.m span{width:64px;height:64px;border-radius:50%;background:var(--sv);border:1px solid var(--ol);display:grid;place-items:center;font-size:26px;margin:0 auto 4px}
.m.on span{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 20%,transparent)}
.sum{display:flex;align-items:center;gap:10px;background:var(--sv);border-radius:14px;padding:13px;cursor:pointer;border:0;color:var(--tx);width:100%;text-align:left;font:14px system-ui}
.sum b{flex:1;font-weight:600}
.outw{display:flex;justify-content:center}.out{position:relative;background:#000;border-radius:14px;overflow:hidden;width:100%;aspect-ratio:16/9}
.out.p{width:52%;aspect-ratio:9/16}.out video{width:100%;height:100%;display:block;background:#000}
.out .tag{position:absolute;top:8px;right:8px;background:#000a;color:#fff;font:10px ui-monospace,monospace;padding:3px 8px;border-radius:8px;z-index:2}
.out .ph{position:absolute;inset:0;display:grid;place-items:center;color:#cbd5e1;font-size:12px;text-align:center;padding:12px}
input[type=text],input[type=password],input[type=url]{width:100%;padding:13px;border-radius:12px;border:1px solid var(--ol);background:var(--sv);color:var(--tx);font:14px system-ui}
input[type=range]{width:100%;accent-color:var(--ac)}
.kw{position:relative}.kw button{position:absolute;right:6px;top:6px;height:34px;border:0;background:0;color:var(--tx);font-size:18px;cursor:pointer}
.pl{display:flex;align-items:center;gap:6px;background:var(--sv);border-radius:12px;padding:8px 10px;border:1px solid transparent}
.pl.on{border-color:var(--ac)}.pl .n{flex:1;min-width:0;cursor:pointer}.pl .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.pl button{border:0;background:0;color:var(--tx);font-size:17px;cursor:pointer;padding:4px 6px}.pl button[disabled]{opacity:.3}
.bar{height:8px;border-radius:9px;background:var(--sv);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.tile{background:var(--sv);border-radius:14px;padding:10px 12px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ok{background:color-mix(in srgb,var(--gn) 14%,transparent);border-color:var(--gn)}.bad{background:color-mix(in srgb,var(--am) 14%,transparent);border-color:var(--am)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--sf);border-top:1px solid var(--ol);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:0;background:0;color:var(--mu);padding:9px 0;font-size:11px;cursor:pointer}nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111c;backdrop-filter:blur(6px);color:#fff;padding:11px 16px;border-radius:14px;max-width:88%;font-size:13px;z-index:50;display:none;text-align:center}
.mask{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40;padding:18px}.mask.on{display:flex}
.dlg{background:var(--sf);border:1px solid var(--ol);border-radius:20px;padding:18px;max-width:420px;width:100%;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg p{white-space:pre-line;font-size:13px;color:var(--mu)}

#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;transition:opacity .4s}
#splash img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 40px var(--ac)}#splash div{margin-top:14px;font:700 22px system-ui;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .chip{padding:12px 4px}
.acc{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:var(--sv);display:grid;place-items:center;font-size:20px}
.lv{height:10px}.ck{color:var(--gn);font-size:20px}
.prow{display:flex;align-items:center;gap:10px}.prow .t{flex:1}
</style></head><body>

let lastKeep=null,lastLog=[],tab=0,overlay=null,sel=0,pickReplace=false,showKey=false,ytRes=null,ytErr=null,ytBusy=false,R=null,camStream=null,scrStream=null,camErr=null,micStream=null,micCtx=null,micRaf=0,ip=null,ipBusy=false,permState={};

function pLive(){const c=R?R.cfg:S.cfg,[w,h]=dims(c),st=R?R.state:'OFFLINE';
const col=(st==='PREVIEW'||st==='LIVE')?'var(--rd)':(st==='CONNECTING'||st==='RECONNECTING')?'var(--am)':st==='ERROR'?'var(--rd)':'var(--mu)';

:`<div class="card"><h3>Preview</h3>${out('<div id="slotCv"></div>',c.orient)}${c.mode==='Camera'?'<div class="row"><button class="sb f" data-act="mic">Mute / Unmute mic</button><button class="sb f" data-act="flip">Switch camera</button></div>':''}</div>`;
return`${header('Broadcast Control',c.mode+' • '+c.res+' '+c.orient+' • '+c.fps+' FPS')}<div class="pg"><div class="card"><div class="row"><b class="f" style="font-size:24px;color:${col}">● ${(st==='PREVIEW'||st==='LIVE')?'LIVE':st.toUpperCase()}</b><b class="k" id="ltime" style="font-size:24px">00:00</b></div>
<div class="row"><div class="f"><div class="sub">Bitrate</div><div class="k">${R&&R.bitrate!=null?(R.bitrate/1000).toFixed(2)+' Mbps':'—'}</div></div><div class="f"><div class="sub">Quality</div><div class="k">${c.res}•${c.orient.replace(':','·')}</div></div><div class="f"><div class="sub">Status</div><div class="k">${st==='PREVIEW'?'Preview':st==='LIVE'?'Live':st}</div></div></div>
<div class="row"><div class="f"><div class="sub">Output</div><div class="k">${w}×${h}</div></div><div class="f"><div class="sub">Target FPS</div><div class="k">${c.fps}</div></div><div class="f"><div class="sub">Audio</div><div class="k">${!c.audio?'Off':(usesFile(c)&&!c.vidAudio&&!c.mic)?'Muted':'On'}</div></div></div>

${!native()&&R?'<div class="warn">Browser preview mode: this page plays your video locally with real timing, but a web page cannot send RTMP to YouTube. The Android engine does the broadcast and keeps going with the screen off.</div>':''}${R&&R.err?`<div class="err">${esc(R.err)}</div>`:''}${R&&R.hint?`<div class="warn">${esc(R.hint)}</div>`:''}</div>${body}
${native()?keepCard()+logCard():''}<button class="btn red" data-act="stop">■ STOP LIVE</button></div>`}
function keepRows(k,live){const r=(ok,t,sub)=>`<div class="prow"><span class="ck" style="color:${ok?'var(--gn)':'var(--mu)'}">${ok?'✔':'○'}</span><div class="t"><b>${t}</b><div class="sub">${sub}</div></div></div>`;
return r(k&&k.fg,'Foreground service','Keeps the stream alive when you leave the app or the screen turns off')+r(k&&k.wake,'CPU wake lock','Stops the processor from sleeping while you stream')+r(k&&k.wifi,'Wi-Fi lock','Asks Android not to power down Wi-Fi (may be ignored on newer Android)')+r(k&&k.battery,'Battery optimisation off','Unrestricted = Android will not pause the stream')+r(true,'Auto-reconnect',S.cfg.retry===0?'Unlimited — reconnects as soon as the network returns':'Up to '+S.cfg.retry+' tries')}
function keepCard(){return`<div class="card"><h3>Background protection</h3>${keepRows(lastKeep,true)}<div class="sub">If the screen turns off the stream keeps running. If the phone loses network it reconnects by itself. If the battery dies or the phone is powered off, streaming stops — that cannot be avoided.</div></div>`}
function logCard(){return`<div class="card"><div class="row"><h3 class="f">Connection log</h3><button class="sb" data-act="copylog">Copy</button></div><div class="sub" style="white-space:pre-wrap;font-family:ui-monospace,monospace">${esc(lastLog.join('\n')||'Waiting for the first event…')}</div><button class="sb" data-act="ytcheck">Not live on YouTube? Open checklist</button></div>`}
function pBg(){const ok=(b)=>b?'<span class="ck">✔</span>':'';const ns=native()?nj('status',{}):null;const np=ns?(ns.notif||'unknown'):('Notification' in window?Notification.permission:'unsupported');

function setVal(k,v){const kk=k.replace('d.',''),num=['fps','abr','sr','kbps','retry'].includes(kk);if(v==='true')v=true;else if(v==='false')v=false;else if(num)v=+v;
if(k==='theme'){S.theme=v;save();render();return}
if(k.startsWith('d.')){S.defaults[kk]=v;if(!live()){S.cfg[kk]=v;if(kk==='orient')S.cfg.dest=v==='9:16'?'YouTube Shorts':'YouTube Live (16:9)'}save();render();return}
if(live()){toast('Stop the live stream before changing stream settings.');return}
if(k==='dest'){applyDest(v);save();render();return}
S.cfg[k]=v;if(k==='orient')S.cfg.dest=v==='9:16'?'YouTube Shorts':'YouTube Live (16:9)';if(k==='fps'&&v===60)toast('YouTube standard ingest expects ≤30 FPS.');save();render()}

const ACT={
noop(){toast('This option is locked while a stream is running.')},noapp(){toast('Battery optimisation can only be changed by the Android app (Allow button works there).')},nomic(){toast('Mixing microphone narration into a video stream is not supported by the native engine yet.')},
set(d){setVal(d.k,d.v)},
tog(d){const k=d.k,isD=k.startsWith('d.'),o=isD?S.defaults:S.cfg,kk=isD?k.slice(2):k;if(!isD&&live()&&kk!=='mic'&&kk!=='vidAudio'){toast('Stop the live stream first.');return}o[kk]=!o[kk];if(isD&&!live())S.cfg[kk]=o[kk];save();render();if(kk==='keepOn')applyKeepOn();if(kk==='mic'&&!isD){o.mic?openMic():closeMic()}if(kk==='vidAudio')pv.muted=!(S.cfg.vidAudio&&S.cfg.audio)},
goto(d){overlay=null;tab=+d.v;render();scrollTo(0,0)},closeov(){overlay=null;render()},bg(){queryPerm();overlay='bg';render();scrollTo(0,0)},
rename(){const t=prompt('App title',S.title);if(t&&t.trim()){S.title=t.trim().slice(0,24);save();render()}},
pick(d){pickReplace=d.v==='1'||S.cfg.mode==='Video Live';if(native()){try{window.TechComNative.pickVideos(pickReplace)}catch(e){toast('Could not open the file picker.')}return}$('#fin').value='';$('#fin').click()},
sel(d){sel=+d.i;if(P[sel]){pv.src=P[sel].url;pv.dataset.id=P[sel].id}render()},
rm(d){if(live())return toast('Stop the stream first.');const i=+d.i;if(!native())URL.revokeObjectURL(P[i].url);P.splice(i,1);save();if(sel>=P.length)sel=Math.max(0,P.length-1);pv.removeAttribute('src');delete pv.dataset.id;pv.load();render()},
mv(d){const i=+d.i,j=i+ +d.d;if(j<0||j>=P.length||live())return;[P[i],P[j]]=[P[j],P[i]];if(sel===i)sel=j;else if(sel===j)sel=i;save();render()},
eye(){S.url=$('#url').value;S.key=$('#key').value;showKey=!showKey;render()},
savekey(){S.url=$('#url').value.trim();S.key=$('#key').value.trim();const mm=S.url.match(/^(rtmps?:\/\/[^\/]+\/[^\/]+)\/([^\/?]+)$/);if(mm&&!S.key){S.url=mm[1];S.key=mm[2];toast('Full URL detected — split into server and stream key.')}{const ki=S.key?keyIssue():null;if(ki){toast(ki);render();return}}if(!/^rtmps?:\/\//i.test(S.url)){toast('Server URL must start with rtmp:// or rtmps://');return}if(!S.key){toast('Enter the stream key first.');return}if(native()){let ok=false;try{ok=window.TechComNative.saveKey(S.key)}catch(e){}if(!ok){S.keySaved=false;toast('Encrypted storage is unavailable on this phone, so the key was not saved. It works for this session only.');save();render();return}}S.keySaved=true;save();toast('RTMP settings saved.');render()},
help(){dialog('<h3>Help</h3><p>1. Studio → pick a source (Video Loop, Video Live, Camera, Screen).\n2. Choose a destination, enter the stream key (YouTube Studio → Go Live → Stream) and tap Save.\n3. Pick resolution, FPS and 16:9 / 9:16.\n4. Tap START LIVE. Broadcast Control opens in the Studio tab.\n5. STOP LIVE ends everything safely.\n\nVideo Loop: add many videos, reorder with ↑ ↓, use Repeat, Shuffle and Auto-play.</p><button class="btn" data-act="close">OK</button>')},
about(){dialog('<h3>About Tech.Com</h3><p>Tech.Com 1.1.0 — live streaming studio.\nCamera, screen and video sources, 16:9 and 9:16 output, playlist, history and settings.\nBroadcasting to YouTube over RTMP is done by the native Android engine; in a browser this page runs a local preview.</p><button class="btn" data-act="close">OK</button>')},
privacy(){dialog('<h3>Privacy Policy</h3><p>Your videos never leave this device: they are opened with the file picker and played locally.\nSettings, history, profile and the stream key are stored only on this device.\nYouTube numbers are requested directly from Google using the API key you enter.\nNo analytics, no ads.</p><button class="btn" data-act="close">OK</button>')},
close(){closeDlg()},
reset(){dialog('<h3>Reset settings?</h3><p>Defaults and theme return to factory values. Your saved stream key and history stay.</p><div class="row"><button class="sb f" data-act="close">Cancel</button><button class="btn f" data-act="doreset">Reset</button></div>')},
doreset(){if(live()){closeDlg();toast('Stop the stream first.');return}S.cfg={...DEF};S.defaults={...DEF};S.theme='dark';save();closeDlg();render();toast('Settings reset.')},
clearhist(){dialog('<h3>Clear history?</h3><p>All saved sessions will be deleted.</p><div class="row"><button class="sb f" data-act="close">Cancel</button><button class="btn f" data-act="doclear">Clear</button></div>')},
doclear(){S.hist=[];save();closeDlg();render()},
ytdlg(){dialog(`<h3>Connect YouTube Live API</h3><p>Connect privately without Google sign-in. Enter your YouTube Data API v3 key and your Live URL, video ID or @channel to show real views, watching and likes on Home.</p><input type="password" id="ytk" placeholder="YouTube Data API v3 Key" value="${esc(S.yt.key)}"><input type="text" id="ytl" placeholder="Live URL, Video ID, or @Channel" value="${esc(S.yt.link)}"><div class="row"><button class="sb f" data-act="close">Cancel</button><button class="btn f" data-act="ytsave">Save</button></div>`)},
copylog(){const t=lastLog.join('\n');if(native()&&window.TechComNative.copy){try{window.TechComNative.copy(t);toast('Log copied.')}catch(e){toast('Could not copy.')}}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('Log copied.'),()=>toast('Could not copy.'))}},
ytcheck(){dialog('<h3>Not live on YouTube? Checklist</h3><p>1. YouTube Studio → Create → Go live → Stream. Your channel must be verified and live streaming enabled (can take up to 24 hours after enabling).\n2. Copy the Stream key again (no spaces) and press Save in Studio. Server: rtmp://a.rtmp.youtube.com/live2\n3. Press “Test connection”. If it fails, your network blocks port 1935 — choose the “YouTube RTMPS (443)” preset.\n4. Press START LIVE in the APK and wait 10–30 seconds. In YouTube Studio the stream health must show Good/Excellent; then press GO LIVE if auto-start is off.\n5. Use 30 FPS unless 60 FPS is set in YouTube. 720p at 4.5 Mbps is safe on mobile data.\n6. A stream key works with one encoder at a time.\n7. Vertical 9:16 needs a vertical/mobile stream on YouTube’s side.</p><button class="btn" data-act="close">OK</button>')},
testconn(){if(!native()){toast('Connection test runs inside the Android app (a browser cannot open RTMP ports).');return}toast('Testing connection…');try{window.TechComNative.testRtmp($('#url')?$('#url').value:S.url)}catch(e){toast('Test not available.')}},
ytsave(){S.yt.key=$('#ytk').value.trim();S.yt.link=$('#ytl').value.trim();save();closeDlg();ytFetch()},ytrefresh(){S.yt.key?ytFetch():ACT.ytdlg()},
acctdlg(){dialog(`<h3>👤 Local Profile</h3><p>Creates a profile stored only on this device. No cloud account is created and nothing syncs.</p><input type="text" id="an" placeholder="Name" value="${esc(S.acct?.name||'')}"><input type="text" id="ae" placeholder="Email address" value="${esc(S.acct?.email||'')}" inputmode="email"><button class="btn" data-act="acctsave">Save profile</button><div class="sub" style="text-align:center">OR</div><button class="sb" disabled>Sign in with Google</button><div class="sub">Google sign-in needs a Google OAuth client ID set up for the Android app, so it is disabled here.</div><button class="sb" data-act="close">Cancel</button>`)},
acctsave(){const n=$('#an').value.trim(),e=$('#ae').value.trim();if(!n)return toast('Enter a name.');if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email address.');S.acct={name:n,email:e};save();closeDlg();render();toast('Profile saved on this device.')},
signout(){S.acct=null;save();render()},

perm(d){grant(d.v)},
async optimize(){if(native()){try{window.TechComNative.requestPerms(JSON.stringify(['notif','camera','microphone']));window.TechComNative.requestBattery()}catch(e){toast('Could not open the settings.')}return}const log=[];await grant('notif',true);await grant('camera',true);await grant('microphone',true);try{const wl=await navigator.wakeLock.request('screen');await wl.release();log.push('wake lock OK')}catch(e){log.push('wake lock unavailable')}toast('Done: '+log.join(', ')+'. Battery setting must be changed in Android settings.');render()},

/* ---------- videos ---------- */
$('#fin').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;let bad=0;const add=[];
for(const f of files){try{add.push(await meta(f))}catch(err){bad++}}
if(add.length){if(pickReplace||S.cfg.mode==='Video Live'){P.forEach(p=>URL.revokeObjectURL(p.url));P=[];sel=0}P.push(...add);pv.dataset.id='';toast(add.length+' video'+(add.length>1?'s':'')+' added.')}
if(bad)toast(bad+' file(s) could not be read as video by this browser.');render()});
function meta(f){return new Promise((res,rej)=>{const url=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';v.muted=true;
const to=setTimeout(()=>{URL.revokeObjectURL(url);rej(new Error('timeout'))},8000);
v.onloadedmetadata=()=>{clearTimeout(to);if(!isFinite(v.duration)||!v.videoWidth){URL.revokeObjectURL(url);rej(new Error('bad'));return}res({id:Math.random().toString(36).slice(2),file:f,url,name:f.name,size:f.size,dur:v.duration,w:v.videoWidth,h:v.videoHeight})};
v.onerror=()=>{clearTimeout(to);URL.revokeObjectURL(url);rej(new Error('err'))};v.src=url})}
/* ---------- camera / screen / mic ---------- */
function stopStream(w){const s=w==='cam'?camStream:scrStream;if(s)s.getTracks().forEach(t=>t.stop());if(w==='cam')camStream=null;else scrStream=null;cv.srcObject=null}
async function openCam(){camErr=null;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camErr='This browser/WebView cannot open the camera.';render();return false}
try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.cfg.facing,width:{ideal:dims(S.cfg)[0]},height:{ideal:dims(S.cfg)[1]}},audio:S.cfg.audio});render();return true}
catch(e){camStream=null;camErr=e.name==='NotAllowedError'?'Camera/microphone permission was denied. Allow it in the browser or app settings.':'Camera error: '+e.name;render();return false}}
async function openScr(){camErr=null;const sa=S.cfg.sAudio;try{scrStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:sa==='System only'||sa==='Mic + System'});
if(sa==='Mic only'||sa==='Mic + System'){try{const m=await navigator.mediaDevices.getUserMedia({audio:true});m.getAudioTracks().forEach(t=>scrStream.addTrack(t))}catch(e){toast('Microphone not available; screen is shared without mic.')}}
scrStream.getVideoTracks()[0].onended=()=>{scrStream=null;if(R&&R.cfg.mode==='Screen')stopRun('Screen capture ended');else render()};render();return true}
catch(e){scrStream=null;camErr=e.name==='NotAllowedError'?'Screen capture was not approved.':'Screen capture error: '+e.name;render();return false}}
async function openMic(){try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micCtx=new (window.AudioContext||window.webkitAudioContext)();const an=micCtx.createAnalyser();an.fftSize=256;micCtx.createMediaStreamSource(micStream).connect(an);const buf=new Uint8Array(an.frequencyBinCount);
const loop=()=>{if(!micStream)return;an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));const e=$('#lvl');if(e)e.style.width=Math.min(100,m/128*160)+'%';micRaf=requestAnimationFrame(loop)};loop();render()}
catch(e){S.cfg.mic=false;save();micStream=null;toast('Microphone permission was denied or unavailable.');render()}}
function closeMic(){cancelAnimationFrame(micRaf);if(micStream)micStream.getTracks().forEach(t=>t.stop());micStream=null;try{micCtx&&micCtx.close()}catch(e){}micCtx=null;render()}
async function queryPerm(){if(native()){const o=nj('status',{});permState={camera:o.camera,microphone:o.microphone};if(overlay==='bg')render();return}permState={};for(const n of['camera','microphone']){try{permState[n]=(await navigator.permissions.query({name:n})).state}catch(e){permState[n]='unknown'}}if(overlay==='bg')render()}
async function grant(w,quiet){{const cur=native()?nj('status',{}):{camera:permState.camera,microphone:permState.microphone,notif:('Notification' in window?Notification.permission:'')};if(cur[w]==='granted'&&!quiet){toast('Already granted.');return}}if(native()){try{window.TechComNative.requestPerms(JSON.stringify([w]))}catch(e){toast('Could not ask for permission.')}return}if(w==='notif'){try{await Notification.requestPermission()}catch(e){}}else{try{const s=await navigator.mediaDevices.getUserMedia(w==='camera'?{video:true}:{audio:true});s.getTracks().forEach(t=>t.stop())}catch(e){if(!quiet)toast('Permission denied or unavailable.')}}await queryPerm();if(!quiet)render()}
/* ---------- run (local preview or native bridge) ---------- */
let wl=null,timer=null;
let allowPreview=false;
async function startRun(){if(!native()&&!allowPreview){dialog('<h3>⚠️ Browser preview mode</h3><p>This page is open in a browser. A browser cannot send video to YouTube (RTMP), so nothing will go live from here.\n\nInstall the Tech.Com APK and press START LIVE inside the app to broadcast.\n\nYou can still run a local preview to test your layout and playlist.</p><button class="btn" data-act="startpreview">Run local preview</button><button class="sb" data-act="ytcheck">How to go live on YouTube</button><button class="sb" data-act="close">Cancel</button>');return}const pr=problem();if(pr){toast(pr);if(/Stream Key|RTMP|video/.test(pr)){tab=1;overlay=null;render()}return}
if(R)return;const c={...S.cfg};const order=c.mode==='Video Loop'&&c.shuffle?[...P].sort(()=>Math.random()-.5):c.mode==='Video Live'?[P[sel]]:[...P];
R={cfg:c,state:'CONNECTING',start:Date.now(),live0:0,i:0,pass:1,order,err:null,bitrate:null,wait:false};overlay=null;tab=1;render();scrollTo(0,0);
if(native()){R.seen=false;try{window.TechComNative.start(JSON.stringify({mode:c.mode,ratio:c.orient,res:c.res,fps:c.fps,kbps:kbps(c),abr:c.abr,sr:c.sr,audio:c.audio&&(c.mode.startsWith('Video')?c.vidAudio:true),fit:c.fit,repeat:c.repeat,shuffle:c.shuffle,facing:c.facing,sAudio:c.sAudio,notif:c.notif,retries:c.retry,url:S.url.trim(),key:S.key.trim(),items:order.map(p=>({uri:p.uri,name:p.name,dur:p.dur}))}))}catch(e){failRun('Native engine error: '+e.message)}timer=setInterval(tickUI,500);return}
try{wl=await navigator.wakeLock.request('screen')}catch(e){}
if(c.mode==='Camera'&&!camStream&&!(await openCam())){failRun(camErr||'Camera unavailable');return}
if(c.mode==='Screen'&&!scrStream&&!(await openScr())){failRun(camErr||'Screen capture unavailable');return}
if(usesFile(c)&&c.mic&&!micStream)await openMic();
if(!R)return;setTimeout(()=>{if(!R||R.state!=='CONNECTING')return;R.state='PREVIEW';R.live0=Date.now();if(usesFile(R.cfg))playItem();notify('Live preview running — '+c.mode);render()},900);timer=setInterval(tickUI,500)}
function notify(m){if(S.cfg.notif&&'Notification' in window&&Notification.permission==='granted'){try{R.n=new Notification('Tech.Com',{body:m})}catch(e){}}}
function playItem(){const it=R.order[R.i];pv.dataset.id=it.id;pv.src=it.url;pv.controls=false;pv.muted=!(R.cfg.vidAudio&&R.cfg.audio);pv.loop=false;pv.onended=()=>{if(!R)return;if(!R.cfg.autoNext&&R.cfg.mode==='Video Loop'){R.wait=true;render();return}nextItem()};pv.onerror=()=>failRun('Could not play “'+it.name+'”.');pv.play().catch(()=>failRun('The browser blocked playback.'))}
function nextItem(){if(!R)return;R.i++;if(R.i>=R.order.length){if(R.cfg.mode==='Video Loop'&&R.cfg.repeat){R.pass++;R.i=0;if(R.cfg.shuffle)R.order.sort(()=>Math.random()-.5)}else{stopRun('Completed');return}}playItem()}
function failRun(msg){if(!R)return;R.err=msg;R.state='ERROR';finish('Failed',msg)}
function stopRun(result){if(!R)return;if(native()){try{window.TechComNative.stop()}catch(e){}}finish(result,null)}
function finish(result,err){const r=R;clearInterval(timer);pv.onended=null;pv.onerror=null;try{pv.pause()}catch(e){}try{r.n&&r.n.close()}catch(e){}
if(r.cfg.mode==='Camera')stopStream('cam');if(r.cfg.mode==='Screen')stopStream('scr');if(micStream&&r.cfg.mic){closeMic();S.cfg.mic=r.cfg.mic}try{wl&&wl.release()}catch(e){};wl=null;
S.hist.unshift({s:r.start,e:Date.now(),mode:r.cfg.mode,res:r.cfg.res+' '+r.cfg.fps+'fps',or:RL[r.cfg.orient],result:err?'Failed':result,err:err||null});save();
if(err)toast(err);R=null;pv.dataset.id='';overlay=null;tab=1;render()}
function tickUI(){if(!R)return;if(native()&&R.state==='CONNECTING'&&!R.slow&&Date.now()-R.start>20000){R.slow=true;toast('Still connecting… use “Test connection” in Studio, or choose the YouTube RTMPS (443) preset.')}const t=$('#ltime');if(t)t.textContent=fmt(R.live0?Date.now()-R.live0:0);
if(native()&&usesFile(R.cfg)&&R.file){const f=R.file,q=(id,v)=>{const e=$(id);if(e)e.textContent=v},b=$('#lbar');if(b)b.style.width=Math.min(100,f.durMs?f.posMs/f.durMs*100:0)+'%';q('#lname',f.name);q('#lpos',fmt(f.posMs)+' / '+fmt(f.durMs));q('#lloop',R.cfg.mode==='Video Loop'?(R.cfg.repeat?'ON (Pass #'+f.pass+')':'OFF'):'Once');q('#litem',f.index+'/'+f.count);return}
if(usesFile(R.cfg)&&R.state==='PREVIEW'){const it=R.order[R.i],d=pv.duration||it.dur,p=pv.currentTime||0;const b=$('#lbar');if(b)b.style.width=Math.min(100,p/d*100)+'%';
const q=(id,v)=>{const e=$(id);if(e)e.textContent=v};q('#lname',it.name);q('#lpos',fmt(p*1000)+' / '+fmt(d*1000));q('#lloop',R.cfg.mode==='Video Loop'?(R.cfg.repeat?'ON (Pass #'+R.pass+')':'OFF'):'Once');q('#litem',(R.i+1)+'/'+R.order.length)}}
document.addEventListener('visibilitychange',async()=>{if(R&&document.visibilityState==='visible'&&!native()){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}});
addEventListener('online',render);addEventListener('offline',render);
/* ---------- YouTube Data API (real numbers only) ---------- */
async function yget(p){const r=await fetch('https://www.googleapis.com/youtube/v3/'+p);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error&&j.error.message||'HTTP '+r.status);return j}
async function ytFetch(){ytBusy=true;ytErr=null;render();try{const k=encodeURIComponent(S.yt.key),l=S.yt.link.trim();if(!S.yt.key)throw new Error('Add a YouTube Data API v3 key first.');if(!l)throw new Error('Add a live URL, video ID or @channel.');
let id=(l.match(/(?:v=|youtu\.be\/|\/live\/|\/shorts\/)([\w-]{11})/)||[])[1]||(/^[\w-]{11}$/.test(l)?l:null);
if(!id&&l.startsWith('@')){const c=await yget('channels?part=id&forHandle='+encodeURIComponent(l)+'&key='+k);const cid=c.items&&c.items[0]&&c.items[0].id;if(!cid)throw new Error('Channel not found.');const s=await yget('search?part=id&channelId='+cid+'&eventType=live&type=video&maxResults=1&key='+k);id=s.items&&s.items[0]&&s.items[0].id.videoId;if(!id)throw new Error('This channel has no live broadcast right now.')}
if(!id)throw new Error('Could not read a video ID from that link.');
const v=await yget('videos?part=snippet,statistics,liveStreamingDetails&id='+id+'&key='+k),it=v.items&&v.items[0];if(!it)throw new Error('Video not found.');
ytRes={channel:it.snippet?.channelTitle,title:it.snippet?.title,live:it.liveStreamingDetails?.concurrentViewers??null,views:it.statistics?.viewCount??null,likes:it.statistics?.likeCount??null}}catch(e){ytRes=null;ytErr=e.message||'Request failed'}ytBusy=false;render()}

window.onNativeVideos=function(arr){if(!Array.isArray(arr)||!arr.length)return;if(arr[0].replace||S.cfg.mode==='Video Live'){P=[];sel=0}arr.forEach(o=>{if(!P.some(p=>p.uri===o.uri))P.push({id:o.id,uri:o.uri,url:o.url,name:o.name,size:o.size,dur:o.dur,w:o.w,h:o.h})});pv.dataset.id='';save();toast(arr.length+' video'+(arr.length>1?'s':'')+' added.');render()};
window.onNativeTest=function(o){toast(o.ok?('Reachable: '+o.host+':'+o.port+' ('+o.ms+' ms). Stream key is checked when you press START LIVE.'):('Cannot reach '+(o.host||'server')+':'+(o.port||'')+' — '+(o.error||'failed')+'. Try the “YouTube RTMPS (443)” preset or another network.'))};
window.onNativePerms=function(o){permState={camera:o.camera,microphone:o.microphone};render()};
window.onNativeState=function(o){if(!o)return;const st=o.state;if(o.keep)lastKeep=o.keep;if(Array.isArray(o.log)&&o.log.length)lastLog=o.log;
 if(!R){if(['CONNECTING','LIVE','RECONNECTING'].includes(st)){R={cfg:{...S.cfg},state:st,start:o.startedAt||Date.now(),live0:o.startedAt||0,i:0,pass:1,order:[],err:null,bitrate:null,wait:false,seen:true,file:null};tab=1;overlay=null;timer=timer||setInterval(tickUI,500);render()}return}
 if(st!=='OFFLINE')R.seen=true;
 if(st==='OFFLINE'){if(R.seen)stopRun(o.result||'Stopped');return}
 if(st==='ERROR'){failRun(o.error||'Streaming error');return}
 const was=R.state;R.state=st;R.err=o.error||null;R.bitrate=o.bitrateKbps??null;R.file=o.file||null;R.keep=o.keep||R.keep;if(o.hint)R.hint=o.hint;
 if(st==='LIVE'&&!R.live0)R.live0=o.startedAt||Date.now();
 if(was!==st||!document.activeElement||document.activeElement.tagName!=='INPUT')render()};
window.onBack=function(){if($('#mask').classList.contains('on')){closeDlg();return true}if(overlay){overlay=null;render();return true}if(tab!==0){tab=0;render();return true}return false};
if(S.cfg.mic){S.cfg.mic=false}
applyKeepOn();
render();if(native()){try{const st=JSON.parse(window.TechComNative.snapshot());window.onNativeState(st)}catch(e){}}
setTimeout(()=>{const s=$('#splash');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),450)}},900);
</script></body></html>
