name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q TechCom.zip
      - name: Apply fixes
        run: |
          python3 - <<'PYEOF'
          import re, sys
          base = 'TechCom/app/src/main/'
          def load(p): return open(p, encoding='utf-8').read()
          def save(p, s): open(p, 'w', encoding='utf-8').write(s)
          def rep(s, a, b, name):
              if a not in s:
                  sys.exit('PATCH FAILED, text not found: ' + name)
              return s.replace(a, b)

          # ---------------- Engine.kt ----------------
          p = base + 'java/com/techcom/live/Engine.kt'
          s = load(p)
          s = rep(s, 'com.pedro.library.util.sources', 'com.pedro.encoder.input.sources', 'imports')
          # video file sources: the library takes the file when the source is created
          s = rep(s, 'val v = VideoFileSource(); val a = AudioFileSource()', 'val v = VideoFileSource(app, uri); val a = AudioFileSource(app, uri)', 'switchTo sources')
          s = rep(s, 'VideoFileSource()', 'VideoFileSource(app, pendingUri)', 'VideoFileSource()')
          s = rep(s, 'AudioFileSource()', 'AudioFileSource(app, pendingUri)', 'AudioFileSource()')
          s = rep(s, 'private var stream: GenericStream? = null', 'private var stream: GenericStream? = null\n    private var pendingUri: Uri = Uri.EMPTY', 'stream field')
          s = rep(s, 'val err = prepare(p.cfg, mp)', 'pendingUri = p.playlist.firstOrNull()?.let { Uri.parse(it.uri) } ?: Uri.EMPTY\n        val err = prepare(p.cfg, mp)', 'begin prepare')
          s = rep(s, 'return FileBridge.load(v, app, uri) && (a is MicrophoneSource || FileBridge.load(a, app, uri))', 'return true', 'loadInto')
          s = rep(s, 'if (!FileBridge.load(v, app, uri) || !FileBridge.load(a, app, uri)) false', 'if (false) false', 'switchTo load')
          # clear audio: mic = mono, everything else stereo, 48 kHz, at least 128 kbps
          s = rep(s, 'val okA = s.prepareAudio(c.sampleRate, true, c.audioKbps * 1000)',
                  'val micAudio = s.audioSource is MicrophoneSource\n            val okA = s.prepareAudio(if (c.mode.usesFile) c.sampleRate else 48000, !micAudio, maxOf(c.audioKbps, 128) * 1000)', 'prepareAudio')
          # crop / zoom
          crop = '''    // ---- crop / zoom (screen) ------------------------------------------------------------------------------
              @Volatile private var cropZoom = 1f
              @Volatile private var cropX = 50f
              @Volatile private var cropY = 50f
              private var cropFilter: Any? = null
              private var cropAdded = false

              /** Zoom into the picture. zoom 1 = full screen; pan values are 0..100 (50 = centre). */
              fun applyCrop(z: Float, px: Float, py: Float): Boolean {
                  cropZoom = z.coerceIn(1f, 4f); cropX = px.coerceIn(0f, 100f); cropY = py.coerceIn(0f, 100f)
                  val s = stream ?: return false
                  return try {
                      val gl = s.getGlInterface()
                      val cls = Class.forName("com.pedro.encoder.input.gl.render.filters.CropFilterRender")
                      val f = cropFilter ?: cls.getDeclaredConstructor().newInstance().also { cropFilter = it }
                      val w = 100f / cropZoom
                      val offX = (100f - w) * cropX / 100f
                      val offY = (100f - w) * cropY / 100f
                      cls.methods.first { it.name == "setCropArea" && it.parameterTypes.size == 4 }.invoke(f, offX, offY, w, w)
                      if (!cropAdded) {
                          gl.javaClass.methods.first { it.name == "setFilter" && it.parameterTypes.size == 1 && it.parameterTypes[0].isAssignableFrom(cls) }.invoke(gl, f)
                          cropAdded = true
                      }
                      true
                  } catch (e: Throwable) {
                      Runtime.hint.value = "Zoom is not available in this encoder version."
                      false
                  }
              }

          '''
          s = rep(s, '    fun toggleMute(): Boolean {', crop + '    fun toggleMute(): Boolean {', 'toggleMute anchor')
          s = rep(s, 'stream = null; sig = null', 'stream = null; sig = null; cropFilter = null; cropAdded = false', 'releaseStream')
          s = rep(s, 'logEv("Encoders ready")', 'logEv("Encoders ready")\n        if (p.cfg.mode == StreamMode.SCREEN) applyCrop(p.cfg.zoom, p.cfg.panX, p.cfg.panY)', 'encoders ready')
          save(p, s)

          # ---------------- Models.kt ----------------
          p = base + 'java/com/techcom/live/Models.kt'
          s = load(p)
          s = rep(s, 'val retries: Int = 0,', 'val retries: Int = 0,\n    val zoom: Float = 1f,\n    val panX: Float = 50f,\n    val panY: Float = 50f,', 'Models retries')
          save(p, s)

          # ---------------- MainActivity.kt ----------------
          p = base + 'java/com/techcom/live/MainActivity.kt'
          s = load(p)
          s = rep(s, 'retries = o.optInt("retries", 0),', 'retries = o.optInt("retries", 0),\n                zoom = o.optDouble("zoom", 1.0).toFloat(), panX = o.optDouble("panX", 50.0).toFloat(), panY = o.optDouble("panY", 50.0).toFloat(),', 'MainActivity cfg')
          s = rep(s, '@JavascriptInterface fun stop() { runOnUiThread { endStream() } }',
                  '@JavascriptInterface fun stop() { runOnUiThread { endStream() } }\n        @JavascriptInterface fun setCrop(z: Double, x: Double, y: Double) { runOnUiThread { EngineHolder.get(this@MainActivity).applyCrop(z.toFloat(), x.toFloat(), y.toFloat()) } }', 'Bridge setCrop')
          save(p, s)

          # ---------------- index.html ----------------
          p = base + 'assets/index.html'
          s = load(p)
          s = rep(s, "sAudio:'Mic only',facing:'user'", "sAudio:'Mic only',zoom:1,panX:50,panY:50,facing:'user'", 'DEF')
          s = rep(s, "abr:128,sr:44100,", "abr:128,sr:48000,", 'DEF sr')
          ctl = '''function cropCtl(){const c=S.cfg,z=c.zoom||1,x=c.panX==null?50:c.panX,y=c.panY==null?50:c.panY;return`<div class="sub">🔍 Crop / Zoom (zoom in on your game)</div><div class="k" id="zv">${z.toFixed(1)}×</div><input type="range" id="zr" min="1" max="3" step="0.1" value="${z}"><div class="sub">Move left ↔ right</div><input type="range" id="zx" min="0" max="100" step="1" value="${x}"><div class="sub">Move up ↕ down</div><input type="range" id="zy" min="0" max="100" step="1" value="${y}"><button class="sb" data-act="zreset">Reset zoom</button>`}
          '''
          s = rep(s, 'function pStudio(){', ctl + 'function pStudio(){', 'cropCtl def')
          s = rep(s, '''${oChips()}${camErr?`<div class="err">${esc(camErr)}</div>`:''}${native()?'<div class="warn">In the app, Android asks for screen-capture''',
                  '''${oChips()}${cropCtl(c)}${camErr?`<div class="err">${esc(camErr)}</div>`:''}${native()?'<div class="warn">In the app, Android asks for screen-capture''', 'screen card crop')
          s = rep(s, '''<button class="sb f" data-act="flip">Switch camera</button></div>':''}</div>`;''',
                  '''<button class="sb f" data-act="flip">Switch camera</button></div>':''}${c.mode==='Screen'&&native()?cropCtl(c):''}</div>`;''', 'live card crop')
          s = rep(s, "if(e.target.id==='kr'){S.cfg.kbps=+e.target.value;",
                  "if(e.target.id==='zr'||e.target.id==='zx'||e.target.id==='zy'){const c=S.cfg;if(e.target.id==='zr'){c.zoom=+e.target.value;const zv=$('#zv');if(zv)zv.textContent=c.zoom.toFixed(1)+'×'}if(e.target.id==='zx')c.panX=+e.target.value;if(e.target.id==='zy')c.panY=+e.target.value;save();if(native()){try{window.TechComNative.setCrop(c.zoom||1,c.panX==null?50:c.panX,c.panY==null?50:c.panY)}catch(_){}}}\nif(e.target.id==='kr'){S.cfg.kbps=+e.target.value;", 'input handler')
          s = rep(s, 'async scrtoggle(){', "zreset(){S.cfg.zoom=1;S.cfg.panX=50;S.cfg.panY=50;save();if(native()){try{window.TechComNative.setCrop(1,50,50)}catch(_){}}render()}, async scrtoggle(){", 'zreset')
          s = rep(s, 'retries:c.retry,url:S.url.trim()', 'retries:c.retry,zoom:c.zoom||1,panX:c.panX==null?50:c.panX,panY:c.panY==null?50:c.panY,url:S.url.trim()', 'start json')
          save(p, s)

          # ---------------- build files ----------------
          p = 'TechCom/build.gradle.kts'
          s = load(p); s = rep(s, '1.9.24', '2.2.0', 'kotlin version'); save(p, s)
          p = 'TechCom/app/build.gradle.kts'
          s = load(p); s = rep(s, '    kotlinOptions { jvmTarget = "17" }\n', '', 'kotlinOptions'); save(p, s)
          print('PATCH OK')
          PYEOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: TechCom
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TechCom-debug-apk
          path: TechCom/app/build/outputs/apk/debug/*.apk
