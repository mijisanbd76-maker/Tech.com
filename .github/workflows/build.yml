name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q TechCom.zip
      - name: Fix Kotlin version
        run: |
          sed -i 's/1\.9\.24/2.2.0/' TechCom/build.gradle.kts
          sed -i '/kotlinOptions/d' TechCom/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: TechCom
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TechCom-debug-apk
          path: TechCom/app/build/outputs/apk/debug/*.apk
