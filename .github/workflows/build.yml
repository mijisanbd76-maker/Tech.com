name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q TechCom.zip
      - name: Fix versions and imports
        run: |
          E=TechCom/app/src/main/java/com/techcom/live/Engine.kt
          sed -i 's/1\.9\.24/2.2.0/' TechCom/build.gradle.kts
          sed -i '/kotlinOptions/d' TechCom/app/build.gradle.kts
          sed -i 's/com\.pedro\.library\.util\.sources/com.pedro.encoder.input.sources/' $E
          sed -i 's/val v = VideoFileSource(); val a = AudioFileSource()/val v = VideoFileSource(app, uri); val a = AudioFileSource(app, uri)/' $E
          sed -i 's/VideoFileSource()/VideoFileSource(app, pendingUri)/g; s/AudioFileSource()/AudioFileSource(app, pendingUri)/g' $E
          sed -i 's/private var stream: GenericStream? = null/private var stream: GenericStream? = null\n    private var pendingUri: Uri = Uri.EMPTY/' $E
          sed -i 's/val err = prepare(p.cfg, mp)/pendingUri = p.playlist.firstOrNull()?.let { Uri.parse(it.uri) } ?: Uri.EMPTY\n        val err = prepare(p.cfg, mp)/' $E
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: TechCom
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TechCom-debug-apk
          path: TechCom/app/build/outputs/apk/debug/*.apk
